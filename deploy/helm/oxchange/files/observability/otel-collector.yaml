# OpenTelemetry Collector: every service sends traces and logs here over
# OTLP. Traces are tail-sampled (spec: "normal traffic is sampled at 1%;
# errors and slow orders are always kept") and stored in Tempo; logs go to
# Loki, keeping their trace_id so a log line links to its trace.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
  # Decided once a trace has been quiet for decision_wait, so the whole
  # order (Gateway, Risk, matcher, Settlement) is judged together.
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    policies:
      - name: errors
        type: status_code
        status_code: { status_codes: [ERROR] }
      - name: slow
        type: latency
        latency: { threshold_ms: 250 }
      - name: sample
        type: probabilistic
        probabilistic:
          sampling_percentage: ${env:TRACE_KEEP_PERCENT:-1}
  batch: {}

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls: { insecure: true }
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus: { host: 0.0.0.0, port: 8888 }
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [otlp/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
