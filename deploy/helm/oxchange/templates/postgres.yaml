# One PostgreSQL server with a database and login per service.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels: {{- include "oxchange.labels" . | nindent 4 }}
data:
  init.sh: |
    {{- .Files.Get "files/postgres-init.sh" | nindent 4 }}
  postgres-init.sql: |
    {{- .Files.Get "files/postgres-init.sql" | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {{- include "oxchange.labels" . | nindent 4 }}
spec:
  # A normal Service: its name resolves even before PostgreSQL is ready, so
  # migrations get "connection refused" and retry, not a DNS error.
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - { name: postgres, port: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {{- include "oxchange.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        {{- include "oxchange.labels" . | nindent 8 }}
    spec:
      securityContext:
        # The postgres user in the alpine image.
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          env:
            # A subdirectory, because the volume root may hold lost+found.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: oxchange-db, key: postgres } }
            {{- range $role := list "accounts" "risk" "settlement" "market_data" "notifications" "auditor" }}
            - name: {{ upper $role }}_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: oxchange-db, key: {{ $role }} } }
            {{- end }}
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            # The last database the init script creates, so all of them exist.
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "notifications"] }
            periodSeconds: 3
            timeoutSeconds: 3
          # Crash recovery after an unclean stop can take minutes on a slow
          # disk, and PostgreSQL rejects connections meanwhile. Liveness only
          # starts once it has accepted one, so it never kills recovery.
          startupProbe:
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres"] }
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres"] }
            # A minute of silence, so a long checkpoint does not count.
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d/init.sh, subPath: init.sh, readOnly: true }
            - { name: init, mountPath: /init/postgres-init.sql, subPath: postgres-init.sql, readOnly: true }
            - { name: run, mountPath: /var/run/postgresql }
      volumes:
        - name: init
          configMap: { name: postgres-init }
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: {{ .Values.postgres.storage }} }
