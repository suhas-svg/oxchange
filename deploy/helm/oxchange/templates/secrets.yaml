{{- /*
Database passwords are generated on the first install and then kept. The
PostgreSQL logins are created once, when its disk is first initialized, so
the passwords must not change (or vanish on uninstall) while that disk lives.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "oxchange-db" }}
apiVersion: v1
kind: Secret
metadata:
  name: oxchange-db
  labels: {{- include "oxchange.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $role := list "postgres" "accounts" "risk" "settlement" "market_data" "notifications" "auditor" }}
  {{ $role }}: {{ if $existing }}{{ index $existing.data $role }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
  {{- end }}
{{- if not .Values.jwt.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: oxchange-jwt
  labels: {{- include "oxchange.labels" . | nindent 4 }}
type: Opaque
data:
  jwt-private.pem: {{ required "set jwt.existingSecret, or pass jwt.privateKeyPem and jwt.publicKeyPem with --set-file" .Values.jwt.privateKeyPem | b64enc }}
  jwt-public.pem: {{ required "set jwt.existingSecret, or pass jwt.privateKeyPem and jwt.publicKeyPem with --set-file" .Values.jwt.publicKeyPem | b64enc }}
{{- end }}
