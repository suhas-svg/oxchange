# Only data that is safe to lose (spec: "Data storage → Redis"): no disk.
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: {{- include "oxchange.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: redis }
  ports:
    - { name: redis, port: 6379 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: {{- include "oxchange.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Never two at once: they would be two different stores.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: redis }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        {{- include "oxchange.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          {{- include "oxchange.containerSecurity" . | nindent 10 }}
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 3
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket: { port: redis }
            periodSeconds: 10
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: {}
