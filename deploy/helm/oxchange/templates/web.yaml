# The dashboard: nginx serving the built React app and forwarding /v1 and
# /ws to the Gateway, so browsers see one origin.
apiVersion: v1
kind: Service
metadata:
  name: web
  labels: {{- include "oxchange.labels" . | nindent 4 }}
spec:
  type: {{ .Values.web.service.type }}
  selector: { app.kubernetes.io/name: web }
  ports:
    - name: http
      port: 80
      targetPort: http
      {{- if and (eq .Values.web.service.type "NodePort") .Values.web.service.nodePort }}
      nodePort: {{ .Values.web.service.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: {{- include "oxchange.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: web }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        {{- include "oxchange.labels" . | nindent 8 }}
    spec:
      securityContext:
        # The nginx user in the unprivileged image.
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: {{ include "oxchange.webImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "oxchange.containerSecurity" . | nindent 10 }}
          env:
            # The full name: nginx resolves it through the cluster DNS
            # server directly, which does not expand short names.
            - { name: GATEWAY_URL, value: "http://gateway.{{ .Release.Namespace }}.svc.cluster.local:8080" }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            # nginx renders its config here at start.
            - { name: conf, mountPath: /etc/nginx/conf.d }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: conf
          emptyDir: {}
{{- if gt (int .Values.web.replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  labels: {{- include "oxchange.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: web }
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  labels: {{- include "oxchange.labels" . | nindent 4 }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: { name: http }
{{- end }}
