[workspace]
resolver = "3"
members = [
    "crates/auth",
    "crates/consumer",
    "crates/domain",
    "crates/order-book",
    "crates/outbox",
    "crates/proto-gen",
    "services/accounts",
    "services/matching",
    "services/order-entry",
    "services/risk",
    "services/settlement",
    "tools/auditor",
    "tools/e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
auth = { path = "crates/auth" }
accounts = { path = "services/accounts" }
consumer = { path = "crates/consumer" }
outbox = { path = "crates/outbox" }
risk = { path = "services/risk" }
settlement = { path = "services/settlement" }
auditor = { path = "tools/auditor" }
fail = "0.5"
argon2 = "0.5"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core", "std"] }
getrandom = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "uuid", "time", "macros"] }
testcontainers-modules = { version = "0.15", features = ["postgres"] }
time = "0.3"
domain = { path = "crates/domain" }
order-book = { path = "crates/order-book" }
proto-gen = { path = "crates/proto-gen" }
matching = { path = "services/matching" }
uuid = { version = "1", features = ["v4", "v7"] }
slab = "0.4"
thiserror = "2"
proptest = "1"
crc32fast = "1"
tempfile = "3"
criterion = "0.7"
hdrhistogram = "7"
prost = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
protox = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
rdkafka = "0.39"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = { version = "3", features = ["termination"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
float_arithmetic = "deny"

# Benchmarks measure what ships: full optimization, one codegen unit.
[profile.bench]
lto = "fat"
codegen-units = 1

[profile.release]
lto = "fat"
codegen-units = 1

# Argon2id is deliberately slow; unoptimized it makes each test login take
# seconds. Optimize just the hashing crates in dev and test builds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
