[package]
name = "settlement"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
telemetry = { workspace = true, features = ["grpc", "sqlx"] }
metrics.workspace = true
axum.workspace = true
consumer.workspace = true
fail.workspace = true
outbox.workspace = true
prost.workspace = true
proto-gen.workspace = true
sqlx.workspace = true
time.workspace = true
tokio.workspace = true
tonic.workspace = true
tracing.workspace = true
uuid.workspace = true

[[bin]]
name = "settlement"
required-features = ["kafka"]

[features]
# Crash points that FAILPOINTS can turn on (live failure tests).
failpoints = ["fail/failpoints"]
kafka = ["outbox/kafka", "consumer/kafka"]

[dev-dependencies]
accounts.workspace = true
auditor.workspace = true
fail = { workspace = true, features = ["failpoints"] }
matching.workspace = true
risk.workspace = true
testcontainers-modules.workspace = true
tokio-stream = { version = "0.1", features = ["net"] }

[lints]
workspace = true
