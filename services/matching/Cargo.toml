[package]
name = "matching"
description = "Oxchange matching engine service: one single-threaded loop per partition, snapshots, replay."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
domain.workspace = true
order-book.workspace = true
proto-gen.workspace = true
prost.workspace = true
crc32fast.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
tonic.workspace = true

# The Kafka adapters and the service binary. librdkafka is built from source,
# which this project does in Docker; host builds leave the feature off.
rdkafka = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
ctrlc = { workspace = true, optional = true }

[features]
kafka = ["dep:rdkafka", "dep:tracing-subscriber", "dep:ctrlc"]

[[bin]]
name = "matching"
required-features = ["kafka"]

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
criterion.workspace = true
hdrhistogram.workspace = true

[lints]
workspace = true

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "latency"
harness = false
