# Static files for the dashboard, and /v1 + /ws forwarded to the Gateway.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 8080;
  server_tokens off;

  # Look the Gateway up through Docker's DNS on each request (cached 10 s),
  # so a recreated or rescaled Gateway is found without restarting nginx.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $gateway http://gateway:8080;
  root /usr/share/nginx/html;

  # Inline style attributes come from React (bar widths); no inline scripts.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  client_max_body_size 16k;

  location /v1/ {
    proxy_pass $gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Replaces anything the client sent; the Gateway reads the last address.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 15s;
  }

  location /ws/ {
    proxy_pass $gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $remote_addr;
    # A quiet stock can go a long time without a message; the streams send
    # no heartbeats, so don't cut idle sockets.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # Hashed build output never changes under the same name.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Every other path is a page of the app.
  location / {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    try_files $uri /index.html;
  }
}
