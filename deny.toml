# cargo-deny: what the dependency tree is allowed to contain. CI runs
# `cargo deny check` next to `cargo audit`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Unmaintained since 2026-11-03, with no maintained release to move to.
    # Only the tests use it (testcontainers copies files into containers);
    # nothing shipped contains it. Drop this once testcontainers replaces it.
    { id = "RUSTSEC-2026-0440", reason = "test-only, via testcontainers; no replacement released yet" },
]

[licenses]
version = 2
# Permissive licenses only.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Two versions of one crate cost build time, not correctness.
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates depend on each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
