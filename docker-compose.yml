# Local development stack (spec: "Deployment": Docker Compose for daily
# development, one Redpanda broker locally).
#
#   docker compose up -d --build          # Postgres, Redis, Redpanda, Accounts, Risk, Settlement,
#                                         # Market Data, Notifications, 4 matchers, and the
#                                         # API Gateway, and the dashboard at http://localhost:3000
#   docker compose --profile legacy up -d order-entry   # Phase 1 order endpoint (no login, skips Risk)
#   docker compose run --rm auditor       # the 11 auditor rules (add --traffic-stopped once orders stop)
#   docker compose run --rm e2e e2e ...   # end-to-end tools
#   scripts/e2e-restart.sh                # Gate 1 restart check
name: oxchange

x-app: &app
  image: oxchange:dev
  build:
    context: .
    dockerfile: deploy/docker/Dockerfile
  environment: &app-env
    KAFKA_BROKERS: redpanda:9092
    RUST_LOG: ${RUST_LOG:-info}
  depends_on:
    topics:
      condition: service_completed_successfully

x-matching: &matching
  <<: *app
  command: ["matching"]
  # Exit non-zero means halted: restart and recover from the newest snapshot.
  restart: on-failure
  read_only: true
  # The spec's shutdown budget is 25 s; give it room before SIGKILL.
  stop_grace_period: 30s

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --default-log-level=warn
    ports:
      - "19092:19092"
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Creates the topics from the spec's "Messaging → Topics" table. Safe to rerun.
  topics:
    image: redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        B="-X brokers=redpanda:9092"
        create() { rpk topic create "$$@" $$B || rpk topic describe "$$1" $$B >/dev/null; }
        for t in orders.commands matching.events settlement.events accounts.events; do
          create "$$t" -p 4 -r 1 -c retention.ms=604800000
        done
        for t in orders.commands matching.events settlement.events accounts.events; do
          create "$$t.dlq" -p 1 -r 1 -c retention.ms=2592000000
        done
        rpk topic list $$B

  matching-0:
    <<: *matching
    environment: { <<: *app-env, PARTITION: "0", SNAPSHOT_DIR: /var/lib/matching, SNAPSHOT_INTERVAL: "${SNAPSHOT_INTERVAL:-100000}" }
    volumes: ["matching-0:/var/lib/matching"]
  matching-1:
    <<: *matching
    environment: { <<: *app-env, PARTITION: "1", SNAPSHOT_DIR: /var/lib/matching, SNAPSHOT_INTERVAL: "${SNAPSHOT_INTERVAL:-100000}" }
    volumes: ["matching-1:/var/lib/matching"]
  matching-2:
    <<: *matching
    environment: { <<: *app-env, PARTITION: "2", SNAPSHOT_DIR: /var/lib/matching, SNAPSHOT_INTERVAL: "${SNAPSHOT_INTERVAL:-100000}" }
    volumes: ["matching-2:/var/lib/matching"]
  matching-3:
    <<: *matching
    environment: { <<: *app-env, PARTITION: "3", SNAPSHOT_DIR: /var/lib/matching, SNAPSHOT_INTERVAL: "${SNAPSHOT_INTERVAL:-100000}" }
    volumes: ["matching-3:/var/lib/matching"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "15432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # The last database init.sql creates, so all of them exist.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d notifications"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Only data that is safe to lose (spec: "Data storage → Redis"), so no volume.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Writes the JWT key pair to a volume on first start (never committed).
  jwt-keys:
    image: oxchange:dev
    command: ["accounts", "keygen", "/keys"]
    volumes: ["jwt-keys:/keys"]

  accounts-migrate:
    image: oxchange:dev
    command: ["accounts", "migrate"]
    environment:
      DATABASE_URL: postgres://accounts:accounts-dev@postgres:5432/accounts
    depends_on:
      postgres:
        condition: service_healthy

  accounts:
    image: oxchange:dev
    command: ["accounts", "serve"]
    environment:
      DATABASE_URL: postgres://accounts:accounts-dev@postgres:5432/accounts
      JWT_PRIVATE_KEY_FILE: /keys/jwt-private.pem
      KAFKA_BROKERS: redpanda:9092
      RUST_LOG: ${RUST_LOG:-info}
    volumes: ["jwt-keys:/keys:ro"]
    ports:
      - "50051:50051"
    read_only: true
    restart: on-failure
    depends_on:
      jwt-keys:
        condition: service_completed_successfully
      accounts-migrate:
        condition: service_completed_successfully
      topics:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "accounts", "health"]
      interval: 2s
      timeout: 3s
      retries: 30

  risk-migrate:
    image: oxchange:dev
    command: ["risk", "migrate"]
    environment:
      DATABASE_URL: postgres://risk:risk-dev@postgres:5432/risk
    depends_on:
      postgres:
        condition: service_healthy

  risk:
    image: oxchange:dev
    command: ["risk", "serve"]
    environment:
      DATABASE_URL: postgres://risk:risk-dev@postgres:5432/risk
      ACCOUNTS_GRPC_URL: http://accounts:50051
      KAFKA_BROKERS: redpanda:9092
      REDIS_URL: redis://redis:6379
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "50052:50051"
    read_only: true
    restart: on-failure
    depends_on:
      risk-migrate:
        condition: service_completed_successfully
      topics:
        condition: service_completed_successfully
      accounts:
        condition: service_healthy
      # Not healthy: Risk runs in reduced mode (no market orders) without it.
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "risk", "health"]
      interval: 2s
      timeout: 3s
      retries: 30

  settlement-migrate:
    image: oxchange:dev
    command: ["settlement", "migrate"]
    environment:
      DATABASE_URL: postgres://settlement:settlement-dev@postgres:5432/settlement
    depends_on:
      postgres:
        condition: service_healthy

  settlement:
    image: oxchange:dev
    command: ["settlement", "serve"]
    environment:
      DATABASE_URL: postgres://settlement:settlement-dev@postgres:5432/settlement
      ACCOUNTS_GRPC_URL: http://accounts:50051
      KAFKA_BROKERS: redpanda:9092
      RUST_LOG: ${RUST_LOG:-info}
    read_only: true
    restart: on-failure
    depends_on:
      settlement-migrate:
        condition: service_completed_successfully
      topics:
        condition: service_completed_successfully
      accounts:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "settlement", "health"]
      interval: 2s
      timeout: 3s
      retries: 30

  market-data-migrate:
    image: oxchange:dev
    command: ["market-data", "migrate"]
    environment:
      DATABASE_URL: postgres://market_data:market-data-dev@postgres:5432/market_data
    depends_on:
      postgres:
        condition: service_healthy

  # REST for book, trades and candles, and /ws/public. Browsers reach it
  # through the Gateway; host port 8090 is for debugging.
  market-data:
    image: oxchange:dev
    command: ["market-data", "serve"]
    environment:
      DATABASE_URL: postgres://market_data:market-data-dev@postgres:5432/market_data
      KAFKA_BROKERS: redpanda:9092
      REDIS_URL: redis://redis:6379
      MATCHING_GRPC_URLS: http://matching-0:50051,http://matching-1:50051,http://matching-2:50051,http://matching-3:50051
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "8090:8080"
    read_only: true
    restart: on-failure
    depends_on:
      market-data-migrate:
        condition: service_completed_successfully
      topics:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "market-data", "health"]
      interval: 2s
      timeout: 3s
      retries: 30

  notifications-migrate:
    image: oxchange:dev
    command: ["notifications", "migrate"]
    environment:
      DATABASE_URL: postgres://notifications:notifications-dev@postgres:5432/notifications
    depends_on:
      postgres:
        condition: service_healthy

  # GET /v1/notifications, POST /v1/ws-ticket and /ws/private. Host port
  # 8091. The /v1 routes trust X-User-Id until the Gateway sits in front.
  notifications:
    image: oxchange:dev
    command: ["notifications", "serve"]
    environment:
      DATABASE_URL: postgres://notifications:notifications-dev@postgres:5432/notifications
      KAFKA_BROKERS: redpanda:9092
      REDIS_URL: redis://redis:6379
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "8091:8080"
    read_only: true
    restart: on-failure
    depends_on:
      notifications-migrate:
        condition: service_completed_successfully
      topics:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "notifications", "health"]
      interval: 2s
      timeout: 3s
      retries: 30

  # A job, not a service: exits 0 when every rule holds.
  auditor:
    image: oxchange:dev
    profiles: ["tools"]
    entrypoint: ["auditor"]
    environment:
      ACCOUNTS_DATABASE_URL: postgres://auditor:auditor-dev@postgres:5432/accounts
      RISK_DATABASE_URL: postgres://auditor:auditor-dev@postgres:5432/risk
      SETTLEMENT_DATABASE_URL: postgres://auditor:auditor-dev@postgres:5432/settlement
      KAFKA_BROKERS: redpanda:9092
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy

  # Development stand-in for the Gateway and Risk: no login, no funds checks.
  # The only service browsers talk to. Host port 8000.
  gateway:
    image: oxchange:dev
    command: ["gateway", "serve"]
    environment:
      ACCOUNTS_GRPC_URL: http://accounts:50051
      RISK_GRPC_URL: http://risk:50051
      MARKET_DATA_URL: http://market-data:8080
      NOTIFICATIONS_URL: http://notifications:8080
      REDIS_URL: redis://redis:6379
      JWT_PUBLIC_KEY_FILE: /keys/jwt-public.pem
      # The web server in front replaces X-Forwarded-For. The host port is
      # bound to localhost only (for the Vite dev server), so nobody else can
      # reach the Gateway directly and spoof the header.
      TRUST_FORWARDED_FOR: "true"
      RUST_LOG: ${RUST_LOG:-info}
    volumes: ["jwt-keys:/keys:ro"]
    ports:
      - "127.0.0.1:8000:8080"
    read_only: true
    restart: on-failure
    depends_on:
      jwt-keys:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "gateway", "health"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The dashboard at http://localhost:3000, in front of the Gateway.
  web:
    build:
      context: ./web
    image: oxchange-web:dev
    ports:
      - "3000:8080"
    read_only: true
    tmpfs: ["/tmp"]
    restart: on-failure
    depends_on:
      gateway:
        condition: service_healthy

  # Phase 1's development endpoint: no login, and it bypasses Risk. Kept
  # for the Gate 1 tools; the Gateway replaces it.
  order-entry:
    <<: *app
    profiles: ["legacy"]
    command: ["order-entry"]
    ports:
      - "8080:8080"
    restart: on-failure

  e2e:
    <<: *app
    profiles: ["tools"]
    command: ["e2e", "verify"]

volumes:
  postgres:
  jwt-keys:
  redpanda:
  matching-0:
  matching-1:
  matching-2:
  matching-3:
