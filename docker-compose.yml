# Local development stack (spec: "Deployment": Docker Compose for daily
# development, one Redpanda broker locally).
#
#   docker compose up -d --build          # Postgres, Redis, Redpanda, Accounts, Risk, Settlement,
#                                         # Market Data, Notifications, 4 matchers, and the
#                                         # API Gateway, and the dashboard at http://localhost:3000
#   docker compose --profile legacy up -d order-entry   # Phase 1 order endpoint (no login, skips Risk)
#   docker compose run --rm auditor       # the 11 auditor rules (add --traffic-stopped once orders stop)
#   docker compose run --rm e2e e2e ...   # end-to-end tools
#   scripts/e2e-restart.sh                # Gate 1 restart check
#
# Observability (spec: "Observability"): Grafana at http://localhost:3001
# (dashboards in the Oxchange folder; anonymous viewing, admin/admin to
# edit), Prometheus at http://localhost:9090. Every trace is kept here
# (TRACE_KEEP_PERCENT=100); the cluster keeps 1% plus errors and slow ones.
name: oxchange

x-app: &app
  image: oxchange:dev
  build:
    context: .
    dockerfile: deploy/docker/Dockerfile
  environment: &app-env
    KAFKA_BROKERS: redpanda:9092
    RUST_LOG: ${RUST_LOG:-info}
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  depends_on:
    topics:
      condition: service_completed_successfully

x-matching: &matching
  <<: *app
  command: ["matching"]
  # Exit non-zero means halted: restart and recover from the newest snapshot.
  restart: on-failure
  read_only: true
  # The spec's shutdown budget is 25 s; give it room before SIGKILL.
  stop_grace_period: 30s

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --default-log-level=warn
    ports:
      - "19092:19092"
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Creates the topics from the spec's "Messaging → Topics" table. Safe to rerun.
  topics:
    image: redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        B="-X brokers=redpanda:9092"
        create() { rpk topic create "$$@" $$B || rpk topic describe "$$1" $$B >/dev/null; }
        for t in orders.commands matching.events settlement.events accounts.events; do
          create "$$t" -p 4 -r 1 -c retention.ms=604800000
        done
        for t in orders.commands matching.events settlement.events accounts.events; do
          create "$$t.dlq" -p 1 -r 1 -c retention.ms=2592000000
        done
        rpk topic list $$B

  matching-0:
    <<: *matching
    environment: { <<: *app-env, PARTITION: "0", SNAPSHOT_DIR: /var/lib/matching, SNAPSHOT_INTERVAL: "${SNAPSHOT_INTERVAL:-100000}" }
    volumes: ["matching-0:/var/lib/matching"]
  matching-1:
    <<: *matching
    environment: { <<: *app-env, PARTITION: "1", SNAPSHOT_DIR: /var/lib/matching, SNAPSHOT_INTERVAL: "${SNAPSHOT_INTERVAL:-100000}" }
    volumes: ["matching-1:/var/lib/matching"]
  matching-2:
    <<: *matching
    environment: { <<: *app-env, PARTITION: "2", SNAPSHOT_DIR: /var/lib/matching, SNAPSHOT_INTERVAL: "${SNAPSHOT_INTERVAL:-100000}" }
    volumes: ["matching-2:/var/lib/matching"]
  matching-3:
    <<: *matching
    environment: { <<: *app-env, PARTITION: "3", SNAPSHOT_DIR: /var/lib/matching, SNAPSHOT_INTERVAL: "${SNAPSHOT_INTERVAL:-100000}" }
    volumes: ["matching-3:/var/lib/matching"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      # Local development passwords only; the cluster generates its own
      # (see deploy/helm/oxchange). The init script reads these once, when
      # the data volume is first created.
      ACCOUNTS_DB_PASSWORD: accounts-dev
      RISK_DB_PASSWORD: risk-dev
      SETTLEMENT_DB_PASSWORD: settlement-dev
      MARKET_DATA_DB_PASSWORD: market-data-dev
      NOTIFICATIONS_DB_PASSWORD: notifications-dev
      AUDITOR_DB_PASSWORD: auditor-dev
    ports:
      - "15432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./deploy/helm/oxchange/files/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./deploy/helm/oxchange/files/postgres-init.sql:/init/postgres-init.sql:ro
    healthcheck:
      # The last database the init script creates, so all of them exist.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d notifications"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Only data that is safe to lose (spec: "Data storage → Redis"), so no volume.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Writes the JWT key pair to a volume on first start (never committed).
  jwt-keys:
    image: oxchange:dev
    command: ["accounts", "keygen", "/keys"]
    volumes: ["jwt-keys:/keys"]

  accounts-migrate:
    image: oxchange:dev
    command: ["accounts", "migrate"]
    environment:
      DATABASE_URL: postgres://accounts:accounts-dev@postgres:5432/accounts
    depends_on:
      postgres:
        condition: service_healthy

  accounts:
    image: oxchange:dev
    command: ["accounts", "serve"]
    environment:
      DATABASE_URL: postgres://accounts:accounts-dev@postgres:5432/accounts
      JWT_PRIVATE_KEY_FILE: /keys/jwt-private.pem
      KAFKA_BROKERS: redpanda:9092
      RUST_LOG: ${RUST_LOG:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes: ["jwt-keys:/keys:ro"]
    ports:
      - "50051:50051"
    read_only: true
    restart: on-failure
    depends_on:
      jwt-keys:
        condition: service_completed_successfully
      accounts-migrate:
        condition: service_completed_successfully
      topics:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "accounts", "health"]
      interval: 2s
      timeout: 3s
      retries: 30

  risk-migrate:
    image: oxchange:dev
    command: ["risk", "migrate"]
    environment:
      DATABASE_URL: postgres://risk:risk-dev@postgres:5432/risk
    depends_on:
      postgres:
        condition: service_healthy

  risk:
    image: oxchange:dev
    command: ["risk", "serve"]
    environment:
      DATABASE_URL: postgres://risk:risk-dev@postgres:5432/risk
      ACCOUNTS_GRPC_URL: http://accounts:50051
      KAFKA_BROKERS: redpanda:9092
      REDIS_URL: redis://redis:6379
      RUST_LOG: ${RUST_LOG:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "50052:50051"
    read_only: true
    restart: on-failure
    depends_on:
      risk-migrate:
        condition: service_completed_successfully
      topics:
        condition: service_completed_successfully
      accounts:
        condition: service_healthy
      # Not healthy: Risk runs in reduced mode (no market orders) without it.
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "risk", "health"]
      interval: 2s
      timeout: 3s
      retries: 30

  settlement-migrate:
    image: oxchange:dev
    command: ["settlement", "migrate"]
    environment:
      DATABASE_URL: postgres://settlement:settlement-dev@postgres:5432/settlement
    depends_on:
      postgres:
        condition: service_healthy

  settlement:
    image: oxchange:dev
    command: ["settlement", "serve"]
    environment:
      DATABASE_URL: postgres://settlement:settlement-dev@postgres:5432/settlement
      ACCOUNTS_GRPC_URL: http://accounts:50051
      KAFKA_BROKERS: redpanda:9092
      RUST_LOG: ${RUST_LOG:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    read_only: true
    restart: on-failure
    depends_on:
      settlement-migrate:
        condition: service_completed_successfully
      topics:
        condition: service_completed_successfully
      accounts:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "settlement", "health"]
      interval: 2s
      timeout: 3s
      retries: 30

  market-data-migrate:
    image: oxchange:dev
    command: ["market-data", "migrate"]
    environment:
      DATABASE_URL: postgres://market_data:market-data-dev@postgres:5432/market_data
    depends_on:
      postgres:
        condition: service_healthy

  # REST for book, trades and candles, and /ws/public. Browsers reach it
  # through the Gateway; host port 8090 is for debugging.
  market-data:
    image: oxchange:dev
    command: ["market-data", "serve"]
    environment:
      DATABASE_URL: postgres://market_data:market-data-dev@postgres:5432/market_data
      KAFKA_BROKERS: redpanda:9092
      REDIS_URL: redis://redis:6379
      MATCHING_GRPC_URLS: http://matching-0:50051,http://matching-1:50051,http://matching-2:50051,http://matching-3:50051
      RUST_LOG: ${RUST_LOG:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "8090:8080"
    read_only: true
    restart: on-failure
    depends_on:
      market-data-migrate:
        condition: service_completed_successfully
      topics:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "market-data", "health"]
      interval: 2s
      timeout: 3s
      retries: 30

  notifications-migrate:
    image: oxchange:dev
    command: ["notifications", "migrate"]
    environment:
      DATABASE_URL: postgres://notifications:notifications-dev@postgres:5432/notifications
    depends_on:
      postgres:
        condition: service_healthy

  # GET /v1/notifications, POST /v1/ws-ticket and /ws/private. Host port
  # 8091. The /v1 routes trust X-User-Id until the Gateway sits in front.
  notifications:
    image: oxchange:dev
    command: ["notifications", "serve"]
    environment:
      DATABASE_URL: postgres://notifications:notifications-dev@postgres:5432/notifications
      KAFKA_BROKERS: redpanda:9092
      REDIS_URL: redis://redis:6379
      RUST_LOG: ${RUST_LOG:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "8091:8080"
    read_only: true
    restart: on-failure
    depends_on:
      notifications-migrate:
        condition: service_completed_successfully
      topics:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "notifications", "health"]
      interval: 2s
      timeout: 3s
      retries: 30

  # A job, not a service: exits 0 when every rule holds.
  auditor:
    image: oxchange:dev
    profiles: ["tools"]
    entrypoint: ["auditor"]
    environment:
      ACCOUNTS_DATABASE_URL: postgres://auditor:auditor-dev@postgres:5432/accounts
      RISK_DATABASE_URL: postgres://auditor:auditor-dev@postgres:5432/risk
      SETTLEMENT_DATABASE_URL: postgres://auditor:auditor-dev@postgres:5432/settlement
      PUSHGATEWAY_URL: http://pushgateway:9091
      KAFKA_BROKERS: redpanda:9092
      RUST_LOG: ${RUST_LOG:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      postgres:
        condition: service_healthy

  # Open-loop load generator (tools/loadgen). Talks to the Gateway like a
  # client and to Accounts only to create and fund its users. Writes its
  # report to ./target/loadgen/.
  #   docker compose run --rm loadgen --rate 500 --duration 60 --out /out/run.json
  loadgen:
    image: oxchange:dev
    profiles: ["tools"]
    entrypoint: ["loadgen"]
    volumes: ["./target/loadgen:/out"]
    depends_on:
      gateway:
        condition: service_healthy

  # The only service browsers talk to (through the web server below).
  gateway:
    image: oxchange:dev
    command: ["gateway", "serve"]
    environment:
      ACCOUNTS_GRPC_URL: http://accounts:50051
      RISK_GRPC_URL: http://risk:50051
      MARKET_DATA_URL: http://market-data:8080
      NOTIFICATIONS_URL: http://notifications:8080
      REDIS_URL: redis://redis:6379
      JWT_PUBLIC_KEY_FILE: /keys/jwt-public.pem
      # The web server in front replaces X-Forwarded-For. The host port is
      # bound to localhost only (for the Vite dev server), so nobody else can
      # reach the Gateway directly and spoof the header.
      TRUST_FORWARDED_FOR: "true"
      RUST_LOG: ${RUST_LOG:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes: ["jwt-keys:/keys:ro"]
    ports:
      - "127.0.0.1:8000:8080"
    read_only: true
    restart: on-failure
    depends_on:
      jwt-keys:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "gateway", "health"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The dashboard at http://localhost:3000, in front of the Gateway.
  web:
    build:
      context: ./web
    image: oxchange-web:dev
    ports:
      - "3000:8080"
    read_only: true
    # nginx (uid 101) renders its config into conf.d at start.
    tmpfs: ["/tmp", "/etc/nginx/conf.d:uid=101,gid=101"]
    restart: on-failure
    depends_on:
      gateway:
        condition: service_healthy

  # Phase 1's development endpoint: no login, and it bypasses Risk. Kept
  # for the Gate 1 tools; the Gateway replaces it.
  order-entry:
    <<: *app
    profiles: ["legacy"]
    command: ["order-entry"]
    ports:
      - "8080:8080"
    restart: on-failure

  e2e:
    <<: *app
    profiles: ["tools"]
    command: ["e2e", "verify"]

  # ---------------------------------------------------------- observability
  # Services send traces and logs here; it samples traces into Tempo and
  # passes logs to Loki.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      TRACE_KEEP_PERCENT: ${TRACE_KEEP_PERCENT:-100}
    volumes:
      - ./deploy/helm/oxchange/files/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [tempo, loki]
    restart: on-failure

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    user: "0"
    volumes:
      - ./deploy/helm/oxchange/files/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo:/var/tempo
    restart: on-failure

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./deploy/helm/oxchange/files/observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki:/loki
    restart: on-failure

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
    volumes:
      - ./deploy/helm/oxchange/files/observability/prometheus-compose.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/helm/oxchange/files/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: on-failure

  # Holds the auditor's last result for Prometheus.
  pushgateway:
    image: prom/pushgateway:v1.10.0
    restart: on-failure

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/overview.json
    volumes:
      - ./deploy/helm/oxchange/files/observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/oxchange.yaml:ro
      - ./deploy/helm/oxchange/files/observability/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/oxchange.yaml:ro
      - ./deploy/helm/oxchange/files/observability/dashboards:/etc/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on: [prometheus, tempo, loki]
    restart: on-failure

volumes:
  postgres:
  jwt-keys:
  redpanda:
  matching-0:
  matching-1:
  matching-2:
  matching-3:
  prometheus:
  tempo:
  loki:
  grafana:
